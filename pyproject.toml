[project]
name = "seam-sprout"
version = "0.1.0"
description = "Embeddable agent runtime with an auditable growth layer"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "JasonXuanxuan", email = "hongxuan.jia2000@gmail.com" },
    { name = "rest8945", email = "haoyu.chang8945@gmail.com" },
    { name = "siyuuuu1014-cell", email = "siyuuuu1014@gmail.com" },
]
dependencies = [
    "aiyallm>=0.1.3",
    "cryptography>=42.0",
    "httpx>=0.27",
    "lark-oapi>=1.4.0",
    "mcp[cli]>=2.2.0",
    "prompt_toolkit>=3.0",
    "questionary>=2.0",
    "rich>=13.7",
    "temporalio>=1.11",
    "typer>=0.27.2",
]

[project.optional-dependencies]
# The three external database lanes: Redis (hot cache), Milvus (vectors),
# Neo4j (graph). `uv sync --extra lanes` or `uv add seam-sprout[lanes]`.
lanes = [
    "redis>=5.0",
    "pymilvus>=2.4",
    "neo4j>=5.20",
]
local-embeddings = ["sentence-transformers>=3.0"]

[project.scripts]
sprout = "Sprout.cli.app:main"
sprout-mcp = "Sprout.mcp.server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/Sprout"]
exclude = ["/src/Sprout/tests/**"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/Sprout/tests", "web/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["Sprout", "web"]
